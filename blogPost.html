                            content: `
                                <p>In a world filled with noise, <strong>ideas have the power to change everything</strong>. You’ve likely heard of the global TED conferences— where the world’s leading thinkers and innovators share their insights in powerful, short talks. But what happens when that global spirit lands right here on our campus? That’s where TEDx comes in.</p>
                                
                                <h3>The «x» Factor</h3>
                                <p>TEDx is a mass initiative created in the spirit of TED’s mission, <em>«ideas worth spreading»</em>. The «x» stands for independently organized TED events. These local, self-organized gatherings bring people together to share a TED-like experience at the community level.</p>
                                <p>For a university, hosting a TEDx event isn’t just an activity — it’s a responsibility. It's about curating the boldest, most innovative thoughts from our students, faculty, and local heroes, and launching them into the global conversation.</p>

                                <p>At UCSI University, we didn't just join the TEDx movement; we helped define it locally. The official TEDxUCSIUniversity chapter has been a hub of intellectual energy, producing some of the most memorable events on campus. While the legacy spans multiple years, you can trace the passion and evolution of our journey through past events.</p>
                                
                                <hr style="border-color: #333; margin: 30px 0;">

                                <p><strong>1. Synchronization 2017: Get Your Life in Sync</strong><br>

                            `

                                <p>在这个充斥着各种声音的世界里，<strong>思想拥有改变一切的力量</strong>。你或许听说过 TED 全球大会 —— 全球顶尖的思想家和创新者们会在这场盛会中，通过简短而富有感染力的演讲分享自己的见解。但当这种影响全球的理念走进我们的校园，又会发生什么呢？这就是 TEDx 的意义所在。</p>

                                <p><em>演讲嘉宾包括：</em> Alaa Bakkar、Amanda Lau、Caleb Wong、Mark Louis Benedict、Myke Celis、Richard Ker、Rowena Morais、Marques Menon、Jeff Lau。</p>

                            content: `
                                <p><strong>What if the beginning of an extraordinary story sounds like nothing more than a door opening?</strong></p>
                                
                                <p>A familiar sound, a passing glance, a brief encounter — ordinary moments often disappear into the background of our daily lives. However, what if we took a pause to see the stories contained in them? What if it was possible to discover something new from the smallest details?</p>
                                
                                <p>To Min Kaung Htet Ko Ko, a chemical engineer, a poet and a storyteller from Myanmar, there is beauty in these mundane experiences that deserve to be collected. His curiosity enables him to look at things differently and find meaning in the most insignificant of life experiences.</p>
                                
                                <p>In his talk titled <em>“Click, Like a Buckle’s Coming Off”</em> at the TEDxUCSIUniversity, he shares how it is possible to come across stories from the most unexpected sources.</p>
                                
                                <h3>Listening to the Ordinary</h3>
                                <p>The significance of story telling is often related to exceptional moments in time, a point of no return in someone’s life or an exceptional experience. However, there is a lot more that can be revealed about the environment that surrounds us if only we were able to learn how to observe it.</p>
                                <p>The view of life proposed by Ko Ko teaches us to go deeper and see something that may seem insignificant to us at first glance. Similarly to a poet who draws meaning from a certain image, Ko Ko suggests us that what is seemingly ordinary can turn into something interesting for us to observe.</p>
                                
                                <h3>Beyond the First Impression</h3>
                                <p>The theme of TEDxUCSIUniversity, <em>“Reading Between the Lines”</em>, is very relevant to this way of telling stories. Going beyond the apparent doesn’t necessarily involve finding great discoveries; sometimes it’s about seeing what potentials lie behind little things.</p>
                                <p>Maybe there’s more to a noise than meets the ear, and more to an incident than meets the eye. The only thing that remains to be seen is whether we’re really paying attention.</p>
                                
                                <p class="highlight-text" style="font-weight: bold; font-size: 1.2rem;">What stories might we be missing simply because we have never stopped to listen?</p>

                            content: `
                                <p><strong>What if our greatest potential lies in the things we have not yet accomplished?</strong></p>
                                
                                <p>In a society that gauges success based on grades, credentials, professional experience and the well-constructed CV, it is quite natural to think that your future lies within your past. However, there arises the thought-provoking question about whether you see yourself through a very limited perspective, when you do not see your future in the qualities you possess, which may just be those that have yet to surface.</p>
                                
                                <p>It is this question, which is being addressed by <em>“Potential Has No CV”</em>, a TEDxUCSIUniversity Talk by Associate Professor Dr. Chew Yik Ling of the Department of Pharmaceutical Chemistry at UCSI University.</p>
                                
                                <p>Being an educator, researcher and mentor, Dr. Chew Yik Ling has built a portfolio of both scientific discoveries and personal development. Among the scientific contributions made by Dr. Chew include hair care products that have been patented and commercialized, steroid free moisturizer for eczema prone skin, and delivery methods of nutraceuticals. Not only is Dr. Chew a researcher but she is also a teacher that teaches her graduate students and works on multi-disciplinary projects. She is an active member of scientific associations like the Malaysian Society for Molecular Biology and Biotechnology (MSMBB) and Young Scientists Network-Academy of Sciences Malaysia (YSN-ASM).</p>
                                
                                <p>Her contributions do not end here. By working through platforms like TalentCorp’s Women-Industry Network and Girls For Girls, she works as a mentor to inspire the youth to become confident and communicate better. This philosophy is in line with her understanding that education is not just about assessing academic success but much more about discovering one’s own potential as well.</p>
                                
                                <h3>Beyond Qualifications, Towards Possibility</h3>
                                <p>The CV highlights one’s past achievements. It is a record of what has been achieved before and the skills that have been proven by actions. However, the CV cannot highlight curiosity, determination, untapped creative power, or boldness to try new things.</p>
                                <p>In terms of students and young professionals, this difference is essential. In an environment that pushes people to create strong profiles, it may be easy to see oneself only through other people’s eyes and judge one’s abilities and capabilities based on their experience.</p>
                                <p>However, potential does not have to be revealed immediately through successes. Instead, it may lie in asking a question, taking up a challenge, or entering the field where one does not yet have enough experience to feel at ease.</p>
                                <p>Through her mentoring practice, Dr. Chew encourages youth to take such a step. The idea she promotes allows understanding that success and achievements should not be seen as the main criteria of one’s potential.</p>
                                <p>As she puts it, <em>“Your potential is not defined by what you have achieved, but by what you dare to become.”</em></p>
                                
                                <h3>The Power of Looking Beyond the Present</h3>
                                <p>The concept of <em>“Potential Has No CV”</em> fits nicely within the bigger picture of TEDxUCSIUniversity, <em>“Reading Beyond the Lines”</em>, because both challenge us to go beyond the surface and think about the biases that underlie the way we perceive things.</p>
                                <p>If we measure people by their qualifications and accomplishments, we run the risk of missing the potential that still lies dormant within them. A student who never led a team might be a future inspirational leader. The person without many years of professional experience might come up with ideas that other people haven’t thought of. A person who currently lacks confidence in his or her abilities might realize what he or she is capable of if given the chance.</p>
                                <p>To recognize someone’s potential, then, it is not enough to analyze what they have. It takes the ability to see what is possible.</p>
                                <p>Maybe this is the most crucial lesson educators and mentors can teach us: to not only tell us about our past but also about our future potential.</p>
                                
                                <h3>Becoming More Than Our Accomplishments</h3>
                                <p><em>“Potential Has No CV”</em> by Dr. Chew provides a timely reminder for anyone trying to make sense of the vagaries of education, career growth or personal development. It is not necessary for us to have everything figured out, done, or learnt before we move ahead towards something better.</p>
                                <p>Her speech at TEDxUCSIUniversity gives us an opportunity to rethink our understanding of success, talent and opportunity. However, more importantly, it provokes us to ask ourselves a question which no resume can ever provide an answer to:</p>
                                
                                <p class="highlight-text" style="font-weight: bold; font-size: 1.2rem;">Who could we become if we stopped allowing what we have done to limit what we dare to do?</p>

                            content: `
                                <p><strong>如果我们最大的潜能，恰恰藏在那些尚未完成的事情之中呢？</strong></p>
                                
                                <p>在一个以成绩、学历、工作经验和精心打造的个人简历来衡量成功的社会里，我们很自然地会认为，自己的未来取决于过去的成就。然而，一个值得深思的问题随之而来：当你无法从自身尚未展现的特质中看见未来时，你是否正以一种过于局限的视角看待自己？</p>
                                
                                <p>这正是 UCSI University 药物化学系副教授 Associate Professor Dr. Chew Yik Ling 在 TEDxUCSIUniversity 演讲《Potential Has No CV》中所探讨的核心问题。</p>
                                
                                <p>作为一名教育工作者、研究人员和导师，Dr. Chew Yik Ling 在科学研究与个人成长领域都取得了丰硕的成果。她的科学贡献包括获得专利并成功商业化的护发产品、专为湿疹易发肌肤研发的不含类固醇保湿产品，以及营养保健品的递送技术。</p>

                                <p>她的贡献并不止于科学研究。通过参与 TalentCorp 的 Women-Industry Network 和 Girls For Girls 等平台，她积极担任导师，鼓励年轻一代建立自信，并提升沟通能力。这种理念也体现了她对教育的理解：教育不仅仅是评估学业成绩，更重要的是帮助人们发掘自身的潜能。</p>

                                <p>简历记录的是一个人过去的成就。它展示了一个人曾经完成的事情，以及通过实际行动证明的能力。然而，简历无法充分体现一个人的好奇心、毅力、尚未开发的创造力，以及勇于尝试新事物的胆量。</p>
                                <p>对于学生和刚踏入职场的年轻人而言，这种区别尤其重要。在一个鼓励人们不断完善个人履历、提升竞争力的环境中，我们很容易开始通过他人的眼光审视自己，并根据过去的经验来判断自身的能力与价值。</p>
                                <p>然而，潜能并不一定会立即通过成功展现出来。它可能隐藏在一个问题之中，存在于一次挑战之中，也可能体现在一个人勇敢踏入陌生领域、即使尚未拥有足够经验和信心的那一刻。</p>
                                <p>通过她的指导与实践，Dr. Chew 鼓励年轻人勇敢迈出这一步。她所倡导的理念提醒我们，不应该将成功与既有成就视为衡量一个人潜能的主要标准。</p>
                                <p>正如她所说：<br><em>“你的潜能并不是由你已经取得的成就所定义，而是取决于你敢于成为怎样的人。”</em></p>
                                
                                <h3>超越当下，发现更广阔的可能</h3>

                                <p>如果我们只根据一个人的学历、资历和成就来评价对方，就可能忽略他们内心尚未被发掘的潜能。</p>
                                <p>一名从未担任过团队领导的学生，未来可能成为鼓舞人心的领导者。一名工作经验尚浅的人，也可能提出别人从未想到过的创新想法。而一个目前对自己缺乏信心的人，或许只需要一次机会，就能真正发现自己的能力。</p>
                                <p>因此，要认识一个人的潜能，仅仅分析他们目前拥有什么是不够的。我们还需要具备看见未来可能性的能力。</p>
                                <p>也许，这正是教育工作者和导师能够教给我们的最重要一课：不仅帮助我们认识自己的过去，更要引导我们看见自己未来可能成为的模样。</p>
                                
                                <h3>成为超越成就的自己</h3>
                                <p>Dr. Chew 在《Potential Has No CV》中的演讲，为每一位正在探索教育、职业发展或个人成长道路的人带来了及时而深刻的提醒。</p>
                                <p>我们不必等到一切都准备就绪，不必等到完成所有目标，也不必等到掌握所有知识，才开始朝着更好的自己迈进。</p>

                                <p class="highlight-text" style="font-weight: bold; font-size: 1.2rem;">如果我们不再让过去的成就限制自己勇于尝试的脚步，那么，我们究竟能够成长为怎样的人？</p>

                            title: "Build a Life Your Younger Self Would Be Proud Of: Making Knowledge Matter",
                            content: `
                                <p><strong>What would your younger self think of the person you are becoming?</strong></p>
                                
                                <p>Measuring success by way of status in one’s profession or how much money one makes, or even recognition from others, may be easy. But there is always the inner part: Are you living a life that matches your principles, interests, and dreams?</p>
                                
                                <p>In the case of Dr. Lim Ing Kien, more popularly known as Dr. Ingky, the answer would revolve around his career as a doctor, entrepreneur, and digital learner. This is a doctor who became an entrepreneur and a video maker and managed to attract three million subscribers with more than 10,000 educational videos.</p>
                                
                                <h3>Making Complex Ideas Understandable</h3>
                                <p>Information about one’s healthcare can be challenging to comprehend. Misleading information, technical language, and complex theories could make it tough for patients to understand how they should look after themselves. Dr. Ingky is well-known for the use of social media to simplify such information and make it easier to digest for everyone.</p>
                                
                                <p>The areas where he has expertise are dermatology and nutrition, and he does well in combining both of these skills through digital platforms. He uses digital media outlets to demystify such complex ideas and teach others about applying this knowledge in real life situations. He backs up his educational efforts with scientifically-based research that makes him reliable and trustworthy.</p>
                                
                                <p>However, his entrepreneurial experience does not stop at creating content for the Internet. Dr. Ingky is a co-founder of several healthcare businesses, such as Skynfyx (telehealth company), NIHON Skin (skincare brand), and Medii Skin Studio (chain of dermatology clinics in Malaysia). He is the founder of Ventamin, where he develops nutritional supplements designed according to scientific research.</p>
                                
                                <h3>Beyond Followers and Achievements</h3>
                                <p>It is indeed amazing to build an audience of millions; however, the story of Dr. Ingky challenges us to consider something else other than the numbers and career successes. The Internet could be not only the source of entertainment and fame but also the place where people could be educated and have their influence on society.</p>
                                
                                <p>Such a notion fits perfectly with the theme of the TEDxUCSIUniversity, <em>“Reading Beyond the Lines”</em>. It helps us think not only about the achievements of people but also about the ways of how they used their knowledge and opportunities to make some contribution to the world.</p>
                                
                                <p>Dr. Ingky’s quote, <em>“Build a life your younger self would be proud of”</em> is the individual way to look at the concept of <em>“Reading Beyond the Lines”</em>.</p>
                                
                                <h3>Defining Success on Your Own Terms</h3>
                                <p>In a world where we are being encouraged to compare all the time, it can be easy to compare ourselves with other people’s progress. But a life of significance does not have to involve following other people’s progress because sometimes our lives can be significant through self-discovery and application of our skills.</p>
                                
                                <p>Dr. Ingky showcases how our passions can work hand-in-hand in order to bring about opportunities to do good things in areas of healthcare, entrepreneurship, and digital education.</p>

                            content: `
                                <p><strong>如果年少时的你看见如今正在成长的自己，你会让他感到骄傲吗？</strong></p>
                                
                                <p>通过职业地位、收入水平，甚至是他人的认可来衡量成功，或许是一件容易的事。然而，我们内心始终存在着一个更深层的问题：你是否正在过着符合自己原则、兴趣与梦想的生活？</p>
                                
                                <p>对于 Lim Ing Kien 医生，也就是大家更熟悉的 Dr. Ingky 而言，答案与他作为医生、企业家及数字内容创作者的职业历程密切相关。他从一名医生跨足创业与视频创作领域，并成功吸引了三百万名订阅者，制作了超过 10,000 部教育视频。</p>
                                
                                <h3>让复杂的知识变得通俗易懂</h3>
                                <p>医疗保健相关的信息往往并不容易理解。误导性信息、专业术语以及复杂的理论，都可能使患者难以了解应该如何照顾自己的健康。</p>
                                <p>Dr. Ingky 因善于利用社交媒体简化这类信息而广为人知，让更多人能够轻松理解与吸收健康知识。</p>
                                <p>他的专业领域包括皮肤科与营养学，并善于通过数字平台将这两个领域的知识结合起来。他利用数字媒体解释复杂的医学概念，并教导大众如何将这些知识应用于现实生活中。</p>
                                <p>与此同时，他的教育内容也以科学研究为基础，使所传递的信息更具可靠性与可信度。</p>
                                <p>然而，Dr. Ingky 的创业经历并不局限于网络内容创作。他也是多家医疗保健相关企业的联合创办人，包括远程医疗公司 Skynfyx、护肤品牌 NIHON Skin，以及在马来西亚经营的皮肤科诊所连锁机构 Medii Skin Studio。此外，他也是 Ventamin 的创办人，致力于根据科学研究开发营养补充剂。</p>
                                
                                <h3>超越粉丝数量与个人成就</h3>
                                <p>能够建立拥有数百万受众的平台，确实是一项令人赞叹的成就。然而，Dr. Ingky 的故事也促使我们思考：除了数字与职业上的成功，还有什么值得我们关注？</p>
                                <p>互联网不仅可以成为娱乐与获得关注的平台，也能够成为传播知识、教育大众，以及对社会产生积极影响的重要渠道。</p>
                                <p>这一理念与 TEDxUCSIUniversity 的主题 <em>“Reading Beyond the Lines”</em>（读懂字里行间之外的意义）十分契合。</p>
                                <p>它提醒我们，在看待一个人的成就时，不应该只关注他们取得了什么，更应该思考他们如何运用自身的知识、能力与机会，为这个世界作出贡献。</p>
                                <p>Dr. Ingky 所提出的 <em>“打造一个让年少的自己引以为傲的人生”</em>（Build a life your younger self would be proud of），正是对 “读懂字里行间之外的意义” 这一理念的个人诠释。</p>
                                
                                <h3>用自己的方式定义成功</h3>
                                <p>在一个不断鼓励人们相互比较的世界里，我们很容易将自己的成长进度与他人进行比较。</p>
                                <p>然而，真正有意义的人生，并不一定需要追随他人的脚步。有时候，人生的价值来自自我探索、认识自身的优势，以及将自己的能力运用在能够创造价值的事情上。</p>
                                <p>Dr. Ingky 的经历向我们展示了，个人兴趣与热情可以相互结合，并在医疗保健、创业及数字教育等领域创造更多机会，为他人带来积极的影响。</p>
                                <p>他的故事也提醒我们，成功不应该仅仅由外在的成就来定义，更应该取决于我们如何运用自己的知识与能力，以及是否正在朝着自己真正认同的方向前进。</p>
                                
                                <p class="highlight-text" style="font-weight: bold; font-size: 1.2rem;">如果年少时的你能够看见今天正在打造人生的自己，那么，什么会让他感到骄傲？</p>
                            `
                        }

                        //image: "./resources/Speaker & Performance/Dr. Shamir Rajadurai.jpeg", 
                        EN: {

                            author: "Djamilya Ishanova Nizamovna",
                            title: "Understanding Crime to Prevent It: Looking Beyond the Obvious",
                            content: `
                                <p><strong>What if preventing crime begins with understanding the person planning to commit it?</strong></p>
                                
                                <p>Crime prevention is something that most people would imagine involves security cameras, alarms, policemen, and locked doors. This approach is one of those that might help in reducing crime, but it is only a small part of a much larger process. For us to understand what leads to crime prevention, we should analyze not just the act, but the thought process behind it as well.</p>
                                
                                <p>This is the perspective of Dr. Shamir Rajadurai, a criminologist, crime prevention specialist, and founder of Prevent Crime Now. With a PhD in Criminology and a Master’s in Criminal Justice from Universiti Malaya, he has dedicated over 15 years to helping individuals and organisations better understand and prevent criminal threats.</p>
                                
                                <h3>Studying Crime from a Different Perspective</h3>
                                <p>The unique aspect of the method developed by Dr. Shamir is his insistence on getting to know the behavior of criminals beyond what the reports and figures suggest and beyond the theories that are formulated about this issue.</p>
                                
                                <p>This point of view provides another way of thinking about security. Rather than trying to react only to events, one could learn something from the process of criminal decision-making before they take place.</p>
                                
                                <p>The practical application of this knowledge has shaped the work of Prevent Crime Now. Dr. Shamir has coached and consulted hundreds of companies and thousands of people in Malaysia, Indonesia, Singapore, and the Philippines. He has worked with companies in several industries such as oil and gas, manufacturing, retail, and others in improving the measures that they have in safeguarding their people and business.</p>
                                
                                <p>The skills of Dr. Shamir have led to his involvement with law enforcement agencies and public institutions like the Royal Malaysia Police, Malaysian Anti-Corruption Commission, and the Judiciary.</p>
                                
                                <h3>From Knowledge to Action</h3>
                                <p>The knowledge about crime may be known to you, but, putting that knowledge into practice is something different altogether. The approach taken by Dr. Shamir makes sure that the crime prevention is easy for everyone to understand and not a subject to be understood only by security experts.</p>
                                
                                <p>Organizations can adopt a similar strategy to realize that security is not just the function of a specialized security department. Understanding of the possible risks can help people from all levels within the organization to create a more secure environment for themselves.</p>
                                
                                <p>As Dr. Shamir explains, <em>“Crime prevention begins when we understand how criminals think and empower communities to stay one step ahead”</em>.</p>
                                
                                <p>Such an idea focuses on putting knowledge into the heart of prevention. The way in which risks develop and criminal opportunities appear is understood through knowledge, and thus proactive measures can be taken without waiting for something to happen.</p>
                                
                                <p>The work of Dr. Shamir has been nationally acknowledged. He earned an entry into the Malaysian Book of Records in 2024 in relation to crime prevention, while he was recognized as a WikiImpact100 Impact Maker in Social Justice in 2025.</p>
                                
                                <h3>Reading Beyond the Incident</h3>
                                <p>Dr. Shamir’s work connects closely with TEDxUCSIUniversity’s theme, <em>“Reading Beyond the Lines”</em>. A crime is often understood through its immediate consequences: what happened, who was affected, and what followed. Yet prevention requires us to examine another set of questions: What made the incident possible? What vulnerabilities were overlooked? Is there anything that should have been done differently?</p>
                                
                                <p>It does not mean to condone criminal activity by looking beyond the obvious but instead means creating a better understanding of the factors and decision making so that the prevention can be more insightful and successful.</p>
                                
                                <p>Moreover, this perspective change will demonstrate that everyone – the community, the organization, and law enforcement – has an equal responsibility for providing safety. Although nothing is able to eliminate all risks, people can be helped to understand them and make better choices.</p>
                                
                                <h3>Staying One Step Ahead</h3>
                                <p>In essence, crime prevention is not just about responding to a threat but also about knowing it well enough to decrease any chances of it happening. From his research, education, and actual work in the field, Dr. Shamir inspires individuals to think of safety with more knowledge and an openness to challenge existing norms.</p>
                                
                                <p>In his TEDxUCSIUniversity speech, he challenges the audience to go past the norm and see how an informed understanding of criminals can help prevent future crimes.</p>
                                
                                <p class="highlight-text" style="font-weight: bold; font-size: 1.2rem;">If understanding how crime happens is the first step towards preventing it, what might we discover by looking beyond the incident itself?</p>
                            `
                        },

                                <p>了解犯罪是一回事，将知识应用于实际生活则是另一回事。</p>
                                <p>Dr. Shamir 希望让犯罪预防不再只是安全专家的专业领域，而是每个人都能理解并实践的责任。只要懂得识别潜在风险，组织中的每个人都能为营造更安全的环境贡献力量。</p>
                                <p>正如他所说：<em>“预防犯罪始于了解犯罪者的思维方式，并赋予社区力量，让大家始终领先一步。”</em> 通过了解风险如何形成，以及犯罪机会如何出现，我们便能提前采取防范措施，而不是等到事情发生后才作出反应。</p>
                                <p>他的专业贡献也获得肯定：他于 2024 年获马来西亚纪录大全记录认证，并于 2025 年获评 WikiImpact100 社会正义领域的影响力人物。</p>
                                
                                <h3>看见事件背后的真相</h3>
                                <p>Dr. Shamir 的理念与 TEDxUCSIUniversity 的主题 <em>“Reading Beyond the Lines”</em>（读懂字里行间之外的意义）息息相关。</p>
                                <p>我们往往只关注犯罪事件的结果，却忽略了更重要的问题：是什么导致事件发生？哪些漏洞被忽略了？我们能否采取不同的措施，避免类似事件再次发生？</p>
                                <p>深入了解犯罪背后的原因，并不代表认同犯罪，而是为了找出更有效的预防方法。同时，维护安全也是整个社会共同的责任。虽然没有任何措施能够完全消除风险，但我们可以通过提升认知，帮助人们更好地识别风险并作出明智的选择。</p>
                                
                                <h3>始终领先一步</h3>
                                <p>归根结底，预防犯罪不仅是应对威胁，更是通过深入了解威胁，降低犯罪发生的可能性。</p>
                                <p>Dr. Shamir 通过研究、教育与实践，鼓励人们跳脱传统思维，以更全面的视角看待安全问题，并探索如何从源头预防犯罪。</p>
                                
                                <p class="highlight-text" style="font-weight: bold; font-size: 1.2rem;">如果了解犯罪如何发生，是预防犯罪的第一步，那么，当我们不再只关注事件本身，而是进一步探究背后的原因时，又会发现什么呢？</p>

                                <p>正如 Kishan 所说：<em>"当有人告诉我某件事我做不到时，我反而会更想去做。"</em></p>

                                <p><strong>How much can we truly understand about a person before we take the time to hear their story?</strong></p>

                                <p>First impressions create the perception we have about other people and our understanding of what they are capable of doing. But the environment in which one lives tells half the story, because knowledge of a person's background is more than what meets the eye — it includes will power, help and opportunity in their story.</p>

                                <p>Cikgu Prakash is an educator, motivational speaker and social activist from Malaysia, where education played an integral part of his background. Because of a visual impairment, Prakash had to educate himself using the Braille method. After finishing his secondary schooling, Prakash went on to study at St. John's Institution and then enrolled at Universiti Malaya in 2003.</p>

                                <h3>From Education to Empowerment</h3>
                                <p>Education became a passion of Prakash, which was then turned into purpose to develop youth in general. While at the university, Prakash actively took part in personal development programs arranged by the Tamil Language Society, where he joined several programs conducted at Tamil schools in Kuala Lumpur and Selangor.</p>
                                <p>From 2009 to 2011, Prakash was working as a counselor at the Educational, Welfare and Research Foundation of Malaysia (EWRF), where he delivered motivational speeches and career development programs in schools all across Malaysia.</p>
                                <p>Prakash established ABC Consultancy in 2013, a consultancy firm that focuses on running empowerment programs and workshops. In its entire life span, the consultancy firm has conducted more than 130 motivational programs spanning topics from confidence building, problem solving, time and stress management, to career development.</p>
                                <p>Through his different activities, Prakash keeps on advocating for skill development and decision making.</p>

                                <h3>Looking Beyond First Impressions</h3>
                                <p>The story of Prakash is very pertinent to the theme of <em>"Reading Beyond the Lines"</em> at TEDxUCSIUniversity. In his story, he challenges some stereotypes on disability and success in the sense that what surrounds someone does not define his abilities or dreams.</p>
                                <p>Furthermore, from this story we get to know how education can empower someone through knowledge and other forms of empowerment such as guidance and the confidence to explore other options.</p>

                                <h3>A Broader Understanding of Possibility</h3>
                                <p>By way of his teaching and inspirational talks, Cikgu Prakash dedicates his entire life to helping others to open their eyes to their own possibilities. By learning from his experience, one learns the importance of treating people on the basis of their true selves and not with any preconceived notions of them.</p>
                                <p>Inspired by <em>"Reading Beyond the Lines"</em>, he urges us to find out from each individual's experience what we can possibly learn about ourselves.</p>

                                <p class="highlight-text" style="font-weight: bold; font-size: 1.2rem;">How might our understanding of others change if we looked beyond what we see and took the time to understand their stories?</p>

                                <p>There may be many reasons for why a person devotes his life to serving others, and many a time it may include the values which he has grown up with many years ago.</p>

                                <p>Tan Sri Lee Lam Thye is one of the most recognized community activists in Malaysia. Lee dedicates his whole life to various issues like public welfare, mental health, industrial safety, crime prevention, and national unity. As his family belongs to that of a blacksmith, Lee grew up with a very humble background. But it is actually Lee's mother who made him what he is today.</p>

                                <h3>A Commitment to Community</h3>
                                <p>Lee has always taken part in various activities aimed at making societies safer, healthier, and more accessible. The problems he is concerned about are diverse but may include such things as crime prevention, occupational safety, mental health, animal welfare, and organ donation. Whatever these problems may be, all these initiatives have the same purpose: to improve people's quality of life.</p>

                                <p>Furthermore, Lee demonstrated an enormous interest in joining organizations that were working towards enhancing public safety and the general well-being of communities. Lee's active involvement reveals the great importance that he attaches to collectivism and cooperation in order to bring any changes into society. It is not worth looking at the problems from a distance; they should be looked at from closer.</p>

                                <p>This attitude has enabled us to know that we have to look beyond our differences and concentrate on the shared responsibility towards our community.</p>

                                <h3>Reading Beyond the Lines</h3>
