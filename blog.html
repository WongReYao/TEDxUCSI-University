        function renderBlogPage() {
            const latestContainer = document.getElementById('latest-post-container');
            const olderContainer = document.getElementById('older-posts-container');
            
            // Safety clear to reset content frames before updating strings
            latestContainer.innerHTML = '';
            olderContainer.innerHTML = '';

            // Synchronize your section title with the active language tracker
            document.getElementById('page-main-heading').innerText = UI_LABELS[currentLanguage].heading;

            // Loop through your dataset object and output HTML elements using your external CSS classes
            Object.values(comprehensiveArticles).forEach(post => {
                const localizedContent = post[currentLanguage];

                if (post.isLatest) {
                    // Generates the top feature story using your exact '.latest-card' style classes
                    latestContainer.innerHTML = `
                    <div class="latest-card" onclick="navigateToPost('${post.id}')">
                        <div class="latest-img-wrapper">
                        <img src="${post.image}" alt="${localizedContent.title}">
                        </div>
                        <div class="latest-content">
                        <h3>${localizedContent.title}</h3>
                        <p class="summary-label">${UI_LABELS[currentLanguage].summaryLabel}</p>
                        <p class="summary-text">${localizedContent.summary}</p>
                        </div>
                    </div>
                    `;
                } else {
                    // Generates the bottom grid item frames using your '.blog-card' style classes
                    olderContainer.innerHTML += `
                    <div class="blog-card" onclick="navigateToPost('${post.id}')">
                        <div class="card-img-wrapper">
                        <img src="${post.image}" alt="${localizedContent.title}">
                        </div>
                        <div class="card-content">
                        <h3>${localizedContent.title}</h3>
                        <p class="summary-label">${UI_LABELS[currentLanguage].summaryLabel}</p>
                        <p class="summary-text">${localizedContent.summary}</p>
                        </div>
                    </div>
                    `;
                }
            });
        }

        // Language toggle trigger that flips values and tells the script to redraw the view strings
        function toggleLanguage() {
            currentLanguage = (currentLanguage === "EN") ? "ZH" : "EN";
            renderBlogPage();
        }

        function navigateToPost(id) {
            window.location.href = `blogPost.html?id=${id}&lang=${currentLanguage}`;
        }

        // Guard routine ensuring your layout objects exist before runtime injection drops text blocks
        document.addEventListener("DOMContentLoaded", renderBlogPage);
